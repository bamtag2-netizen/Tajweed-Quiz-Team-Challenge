<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جهاز اللاعب - مسابقة التجويد السحابية</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #2c3e50; margin: 0; padding: 20px; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; box-sizing: border-box; }
        .player-container { max-width: 500px; width: 100%; background: rgba(255,255,255,0.1); padding: 25px; border-radius: 12px; backdrop-filter: blur(10px); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; text-align: center; color: #2c3e50; font-weight: bold; }
        .join-btn { background: #2ecc71; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .pad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; height: 70vh; }
        .pad-btn { border: none; border-radius: 15px; cursor: pointer; transition: transform 0.1s; }
        .pad-btn:active { transform: scale(0.95); }
        .pad-btn[disabled] { opacity: 0.3; cursor: not-allowed; }
        .red-btn { background-color: #e74c3c; } .blue-btn { background-color: #3498db; } .yellow-btn { background-color: #f1c40f; } .green-btn { background-color: #2ecc71; }
        .hidden { display: none !important; }
        .status-msg { font-size: 24px; font-weight: bold; color: #f1c40f; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="player-container" id="login-zone">
    <h2>انضم للمسابقة التفاعلية 🎮</h2>
    <input type="number" id="room-input" placeholder="أدخل رمز الغرفة PIN">
    <input type="text" id="name-input" placeholder="أدخل اسمك المستعار" maxlength="20">
    <button class="join-btn" onclick="connectToRoom()">دخول الغرفة</button>
</div>

<div class="pad-grid hidden" id="game-pad">
    <button class="pad-btn red-btn" onclick="sendAnswer(0)"></button>
    <button class="pad-btn blue-btn" onclick="sendAnswer(1)"></button>
    <button class="pad-btn yellow-btn" onclick="sendAnswer(2)"></button>
    <button class="pad-btn green-btn" onclick="sendAnswer(3)"></button>
</div>

<div class="player-container hidden" id="status-zone">
    <div class="status-msg" id="status-text">انتظر المضيف لتجهيز السؤال... ⏳</div>
</div>

<script>
// تجميع التوثيق الكامل والشامل والموثق للمفاتيح للتغلب على قيود متصفح اللاعبين
const firebaseConfig = {
    apiKey: "AIzaSyDlp5NX_GbR1CPwUVerPaMhA05yK39FmEE",
    authDomain: "tajweed-quiz-challenge.firebaseapp.com",
    databaseURL: "https://tajweed-quiz-challenge-default-rtdb.firebaseio.com",
    projectId: "tajweed-quiz-challenge",
    storageBucket: "tajweed-quiz-challenge.appspot.com",
    messagingSenderId: "311935442055",
    appId: "1:311935442055:web:5163bd442ef57b8504a79c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let myPlayerId = "p_" + Math.random().toString(36).substr(2, 9);
let currentServerQIdx = -1;
let registeredPIN = "";
let playerName = "";

function connectToRoom() {
    registeredPIN = document.getElementById('room-input').value;
    playerName = document.getElementById('name-input').value;

    if(registeredPIN !== "2026") {
        alert("رمز الغرفة غير صحيح! تأكد من كتابة 2026");
        return;
    }
    if(!playerName) { alert("من فضلك أدخل اسمك المستعار!"); return; }

    db.ref(`rooms/${registeredPIN}/players/${myPlayerId}`).set({ name: playerName, score: 0 })
    .then(() => {
        document.getElementById('login-zone').classList.add('hidden');
        document.getElementById('status-zone').classList.remove('hidden');
        listenToGameStatus();
    })
    .catch((error) => {
        alert("فشل الاتصال بالسيرفر: " + error.message);
    });
}

function listenToGameStatus() {
    db.ref(`rooms/${registeredPIN}/status`).on('value', (snapshot) => {
        const status = snapshot.val();
        if (!status) return;

        if (status.state === "active" && status.currentIndex !== currentServerQIdx) {
            currentServerQIdx = status.currentIndex;
            document.getElementById('status-zone').classList.add('hidden');
            document.getElementById('game-pad').classList.remove('hidden');
            const buttons = document.querySelectorAll('.pad-btn');
            buttons.forEach(btn => btn.disabled = false);
        } else if (status.state === "frozen" || status.state === "ended") {
            document.getElementById('game-pad').classList.add('hidden');
            document.getElementById('status-zone').classList.remove('hidden');
            document.getElementById('status-text').innerText = status.state === "ended" ? "انتهت المسابقة بالكامل! 🎉" : "انتهى وقت الإجابة! طالع الشاشة الرئيسية...🛑";
        }
    });
}

function sendAnswer(buttonIndex) {
    const buttons = document.querySelectorAll('.pad-btn');
    buttons.forEach(btn => btn.disabled = true);

    document.getElementById('game-pad').classList.add('hidden');
    document.getElementById('status-zone').classList.remove('hidden');
    document.getElementById('status-text').innerText = "تم إرسال إجابتك بنجاح! ⚡";

    db.ref(`rooms/${registeredPIN}/answers`).push({
        pId: myPlayerId,
        qIdx: currentServerQIdx,
        chosen: buttonIndex
    });
}
</script>
</body>
</html>
